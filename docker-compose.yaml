
services:
  mysql:
    image: mysql:8.0
    container_name: servidor-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mensajeria
      MYSQL_USER: app
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -proot_clave_segura
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

